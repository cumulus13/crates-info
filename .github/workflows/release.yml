# ─────────────────────────────────────────────────────────────────────────────
# Release — triggers when you push a version tag: git tag v0.2.0 && git push --tags
#
# Platform coverage (grouped by how they're built):
#
#   Native runners (no Docker):
#     Windows   x86_64 / i686 / arm64   (arm64 needs clang, preinstalled on windows-latest)
#     macOS     x86_64 / arm64
#
#   Linux, via `cross` (Docker, confirmed supported by cross-rs):
#     x86_64, i686, aarch64, armv7, armv6 (arm), armv5   [required]
#     mips, mipsel, mips64, riscv64gc, s390x, ppc64le     [best-effort — see allow-failure]
#     Android/Termux: aarch64, armv7                      [required]
#
#   BSD, via `cross`:
#     FreeBSD x86_64 / i686, NetBSD x86_64                [best-effort]
#
#   NOT included — no maintained cross-rs image exists for these, so a build
#   would either silently be wrong or just fail:
#     OpenBSD (any arch), FreeBSD arm64/armv7, NetBSD arm
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - "v*"
    branches: ["master", "main"]
  workflow_dispatch:            # manual escape hatch — run this from `gh` or the Actions tab
    inputs:
      tag:
        description: "Tag to release (must already exist), e.g. v1.0.2"
        required: false

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: cratesinfo

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  # ── build one artifact per target ───────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux — required, well-supported ──────────────────────────────
          - { target: x86_64-unknown-linux-musl,       runner: ubuntu-latest, asset_suffix: linux-x86_64,  use_cross: true,  smoke_test: native }
          - { target: i686-unknown-linux-gnu,          runner: ubuntu-latest, asset_suffix: linux-i686,    use_cross: true,  smoke_test: qemu }
          - { target: aarch64-unknown-linux-musl,      runner: ubuntu-latest, asset_suffix: linux-arm64,   use_cross: true,  smoke_test: qemu }
          - { target: armv7-unknown-linux-musleabihf,  runner: ubuntu-latest, asset_suffix: linux-armv7,   use_cross: true,  smoke_test: qemu }
          - { target: arm-unknown-linux-musleabihf,    runner: ubuntu-latest, asset_suffix: linux-armv6,   use_cross: true,  smoke_test: qemu }
          - { target: armv5te-unknown-linux-musleabi,  runner: ubuntu-latest, asset_suffix: linux-armv5,   use_cross: true,  smoke_test: qemu }

          # ── Linux — best-effort (portable-C fallback in `ring`, less battle-tested) ──
          - { target: mips-unknown-linux-musl,          runner: ubuntu-latest, asset_suffix: linux-mips,     use_cross: true, smoke_test: qemu, allow_failure: true }
          - { target: mipsel-unknown-linux-musl,        runner: ubuntu-latest, asset_suffix: linux-mipsel,   use_cross: true, smoke_test: qemu, allow_failure: true }
          - { target: mips64-unknown-linux-muslabi64,   runner: ubuntu-latest, asset_suffix: linux-mips64,   use_cross: true, smoke_test: qemu, allow_failure: true }
          - { target: riscv64gc-unknown-linux-musl,     runner: ubuntu-latest, asset_suffix: linux-riscv64,  use_cross: true, smoke_test: qemu, allow_failure: true }
          - { target: s390x-unknown-linux-gnu,          runner: ubuntu-latest, asset_suffix: linux-s390x,    use_cross: true, smoke_test: qemu, allow_failure: true }
          - { target: powerpc64le-unknown-linux-gnu,    runner: ubuntu-latest, asset_suffix: linux-ppc64le,  use_cross: true, smoke_test: qemu, allow_failure: true }

          # ── BSD — best-effort (no QEMU test support in cross-rs, build-only) ──
          - { target: x86_64-unknown-freebsd, runner: ubuntu-latest, asset_suffix: freebsd-x86_64, use_cross: true, smoke_test: none, allow_failure: true }
          - { target: i686-unknown-freebsd,   runner: ubuntu-latest, asset_suffix: freebsd-i686,   use_cross: true, smoke_test: none, allow_failure: true }
          - { target: x86_64-unknown-netbsd,  runner: ubuntu-latest, asset_suffix: netbsd-x86_64,  use_cross: true, smoke_test: none, allow_failure: true }

          # ── Android / Termux — required, well-supported (bionic libc) ──────
          - { target: aarch64-linux-android,      runner: ubuntu-latest, asset_suffix: android-arm64,  use_cross: true, smoke_test: qemu }
          - { target: armv7-linux-androideabi,    runner: ubuntu-latest, asset_suffix: android-armv7,  use_cross: true, smoke_test: qemu }

          # ── macOS — native runners ──────────────────────────────────────────
          - { target: x86_64-apple-darwin,  runner: macos-latest, asset_suffix: macos-x86_64, use_cross: false, smoke_test: rosetta }
          - { target: aarch64-apple-darwin, runner: macos-latest, asset_suffix: macos-arm64,  use_cross: false, smoke_test: native }

          # ── Windows — native runners ────────────────────────────────────────
          - { target: x86_64-pc-windows-msvc,  runner: windows-latest, asset_suffix: windows-x86_64, use_cross: false, smoke_test: native }
          - { target: i686-pc-windows-msvc,    runner: windows-latest, asset_suffix: windows-i686,   use_cross: false, smoke_test: native }
          - { target: aarch64-pc-windows-msvc, runner: windows-latest, asset_suffix: windows-arm64,  use_cross: false, smoke_test: none, allow_failure: true }

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        run: echo "RELEASE_TAG=${{ inputs.tag || github.ref_name }}" >> $GITHUB_ENV

      # Native builds need the target installed via rustup. Cross builds don't —
      # `cross` supplies its own sysroot inside the Docker image, and several of
      # the exotic targets above aren't even installable via `rustup target add`
      # (no prebuilt std), so we must NOT request them here.
      #
      # NOTE: this is intentionally two separate steps rather than one step with
      # `targets: ${{ matrix.use_cross && '' || matrix.target }}` — that ternary
      # looks right but is wrong: GitHub Actions expressions treat '' as falsy,
      # so `'' || matrix.target` always evaluates to matrix.target regardless of
      # use_cross, silently defeating the whole point of the condition.
      - name: Install stable Rust (native)
        if: "!matrix.use_cross"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install stable Rust (cross)
        if: matrix.use_cross
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      # Windows arm64 needs clang specifically — `ring`'s build script already
      # forces it internally for this target, but we pin it explicitly too
      # since it's harmless and documents the requirement.
      - name: Select clang for Windows arm64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: echo "CC=clang" >> $env:GITHUB_ENV

      # Pinned prebuilt binary instead of `cargo install --git` — building cross
      # from source on every one of the ~15 cross-target jobs is slow and ties
      # your release to whatever cross-rs's main branch happens to do that day.
      - name: Install cross
        if: matrix.use_cross
        run: |
          curl -L https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv cross /usr/local/bin/

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build with cargo
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      # ── Smoke test: actually run the binary, not just compile it ─────────────
      - name: Smoke test (native)
        if: matrix.smoke_test == 'native'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version

      - name: Smoke test (QEMU via cross)
        if: matrix.smoke_test == 'qemu'
        run: cross run --release --target ${{ matrix.target }} -- --version

      - name: Smoke test (macOS x86_64 via Rosetta)
        if: matrix.smoke_test == 'rosetta'
        continue-on-error: true   # Rosetta isn't guaranteed present on every runner image
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} --version

      # ── Package ─────────────────────────────────────────────────────────────
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          ARCHIVE="${{ env.BINARY_NAME }}-${{ env.RELEASE_TAG }}-${{ matrix.asset_suffix }}.tar.gz"
          tar -czf "../../../${ARCHIVE}" ${{ env.BINARY_NAME }}
          echo "ASSET=${ARCHIVE}" >> $GITHUB_ENV

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          $ARCHIVE = "${{ env.BINARY_NAME }}-${{ env.RELEASE_TAG }}-${{ matrix.asset_suffix }}.zip"
          Compress-Archive -Path "${{ env.BINARY_NAME }}.exe" -DestinationPath "../../../$ARCHIVE"
          echo "ASSET=$ARCHIVE" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        if: env.ASSET != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.asset_suffix }}
          path: ${{ env.ASSET }}

  # ── create GitHub Release and attach all binaries ───────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        run: echo "RELEASE_TAG=${{ inputs.tag || github.ref_name }}" >> $GITHUB_ENV

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate checksums (SHA-256)
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "cratesinfo ${{ env.RELEASE_TAG }}"
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          body: |
            ## cratesinfo ${{ env.RELEASE_TAG }}

            A fast CLI tool to get detailed info about Rust crates from crates.io.

            ### Installation

            **Windows** — download `cratesinfo-${{ env.RELEASE_TAG }}-windows-x86_64.zip`, extract, add to PATH.

            **macOS (Intel)**
            ```sh
            curl -L https://github.com/cumulus13/crates-info/releases/download/${{ env.RELEASE_TAG }}/cratesinfo-${{ env.RELEASE_TAG }}-macos-x86_64.tar.gz | tar xz
            sudo mv cratesinfo /usr/local/bin/
            ```

            **macOS (Apple Silicon)**
            ```sh
            curl -L https://github.com/cumulus13/crates-info/releases/download/${{ env.RELEASE_TAG }}/cratesinfo-${{ env.RELEASE_TAG }}-macOS-arm64.tar.gz | tar xz
            sudo mv cratesinfo /usr/local/bin/
            ```

            **Linux x86-64 (static)**
            ```sh
            curl -L https://github.com/cumulus13/crates-info/releases/download/${{ env.RELEASE_TAG }}/cratesinfo-${{ env.RELEASE_TAG }}-linux-x86_64.tar.gz | tar xz
            sudo mv cratesinfo /usr/local/bin/
            ```

            **Via cargo (all platforms)**
            ```sh
            cargo install crates-info
            ```

            Other Linux architectures (arm, mips, riscv64, s390x, ppc64le), FreeBSD, NetBSD,
            and Android/Termux builds are attached below. Some of the less common
            architectures are best-effort — check `SHA256SUMS.txt` and the build logs
            for this release if one is missing.

            ### Checksums
            See `SHA256SUMS.txt` attached below.

          files: |
            artifacts/*

  publish:
    name: Publish to crates.io
    needs: release   # was previously commented out — publish could fire even if builds failed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}